<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coderhouse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container my-5">
        <div class="row">
            <h1 class="text-center fw-bold my-3">Comidas Argentinas</h1>
            <div class="col-md-3 offset-md-3">
                <a href="asado-banderita.html">
                    <img src="images/asado-banderita.jpg" alt="" class="img-fluid">
                </a>
            </div>
            <div class="col-md-3">
                <a href="hamburguesa-casera.html">
                    <img src="images/hamburguesa-casera.jpg" alt="" class="img-fluid">
                </a>
            </div>
        </div>
        <div class="row my-5">
          <div class="col-md-6 offset-md-3">
            <h2 class="display-6 text-center">Agregar nueva Mascota</h2>
            <form method="post" action="/api/pets/" enctype="multipart/form-data">
              <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Imagen</label>
                <input type="file" class="form-control" id="file" name="file" required>
              </div>
              <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
          </div>
          <div id="resultado" class="my-3 text-center text-danger"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/funciones.js"></script>
  </body>
</html>
